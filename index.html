<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OhMochi Developer - Legal & Privacy Center</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0;
            font-size: 0.95rem;
        }

        .app-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            text-transform: capitalize;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .legal-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .legal-link:hover {
            background-color: rgba(56, 189, 248, 0.08);
            border-color: var(--accent);
            color: var(--accent-hover);
        }

        .arrow {
            transition: transform 0.2s ease;
        }

        .legal-link:hover .arrow {
            transform: translateX(4px);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✨ OhMochi Console Center</h1>
        <p>Pusat informasi dokumen hukum, privasi, dan ketentuan layanan aplikasi mobile.</p>
    </header>

    <!-- Konten Aplikasi akan Dimasukkan Secara Otomatis di Sini -->
    <div id="apps-container">
        <p class="loading-text">Memuat daftar aplikasi...</p>
    </div>

    <footer>
        <p>&copy; 2026 OhMochi. Hak Cipta Dilindungi.<br>Hubungi kami: ohmochisukabumi@gmail.com</p>
    </footer>
</div>

<script>
    // Konfigurasi Akun GitHub Anda
    const username = "ohmochi-page";
    const repo = "ohmochi-page.github.io";

    async function loadApps() {
        const container = document.getElementById('apps-container');
        try {
            // Memanggil GitHub API untuk membaca isi root folder repositori
            const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
            const items = await response.json();
            
            // Saring hanya item yang berbentuk FOLDER dan berakhiran '-Legal'
            const legalFolders = items.filter(item => item.type === 'dir' && item.name.endsWith('-Legal'));

            if (legalFolders.length === 0) {
                container.innerHTML = '<p class="loading-text">Belum ada dokumen aplikasi yang diunggah.</p>';
                return;
            }

            container.innerHTML = ''; // Hapus teks loading

            // Lakukan looping untuk setiap folder aplikasi yang ditemukan
            legalFolders.forEach(folder => {
                // Ubah nama folder menjadi Nama Aplikasi yang rapi (Contoh: "TradeCheck-Pro-Legal" -> "TradeCheck Pro")
                const appName = folder.name.replace('-Legal', '').replace(/-/g, ' ');
                const folderPath = folder.name;

                // Template Kartu HTML Otomatis
                const cardHTML = `
                    <div class="app-card">
                        <div class="app-title">📱 ${appName}</div>
                        <div class="links-grid">
                            <a class="legal-link" href="/${folderPath}/privacy-policy.html">
                                <span>Kebijakan Privasi (Privacy Policy)</span>
                                <span class="arrow">➡️</span>
                            </a>
                            <a class="legal-link" href="/${folderPath}/terms-of-service.html">
                                <span>Ketentuan Layanan (Terms of Service)</span>
                                <span class="arrow">➡️</span>
                            </a>
                            <a class="legal-link" href="/${folderPath}/delete-account.html">
                                <span>Penghapusan Data (Delete Account)</span>
                                <span class="arrow">➡️</span>
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

        } catch (error) {
            console.error('Gagal memuat repositori:', error);
            container.innerHTML = '<p class="loading-text" style="color: #ef4444;">Gagal memuat daftar aplikasi otomatis.</p>';
        }
    }

    // Jalankan fungsi saat halaman dibuka
    loadApps();
</script>

</body>
</html>
